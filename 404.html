<body data-page="404">

<div class="wrap" style="max-width:720px;padding-top:16vh">
  <div style="text-align:center">

    <div style="width:64px;height:64px;margin:0 auto 30px;opacity:.85">
      <img src="assets/img/mark-white.png" alt="AREA-372" style="width:100%;height:100%;object-fit:contain">
    </div>

    <div class="code" style="font-size:11px;letter-spacing:.28em;color:var(--warn);margin-bottom:16px">
      ERROR 404 · RECORD NOT FOUND
    </div>

    <h1 class="disp" style="font-size:clamp(22px,4vw,32px);letter-spacing:.12em">
      档案不存在
    </h1>

    <p style="margin-top:22px;font-size:13.5px;line-height:2;color:var(--dim)">
      你请求的卷宗在 AREA-372 的档案索引中没有对应条目。<br>
      可能原因：编号录入错误、档案已被撤回，或该条目从未被允许存在。
    </p>

    <div class="note" style="margin-top:34px;text-align:left;border-left-color:var(--dim-2)">
      <span class="lbl">档案原则</span>
      档案目录本身是公开的——你可以看到它存在，也可以看到它被谁持有。
      但当一条档案连目录里都没有位置时，我们建议你回到入口重新核对编号，
      而不是假定它被删除。
    </div>

    <div style="margin-top:38px">
      <a class="btn primary" href="index.html">返回终端接入 / RETURN</a>
    </div>

    <div style="margin-top:20px">
      <a class="btn ghost" href="home.html">直接进入设施主页</a>
    </div>

  </div>
